services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: baseball_intelligence
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
